name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check PDF App
        shell: bash
        run: nix develop .#pdf-app -c scripts/check.sh

      - name: Browser acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elm-browser-acceptance
          path: /tmp/pdf-elm-acceptance
